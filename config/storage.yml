test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Credentials are read from the CLOUDINARY_URL env var by the cloudinary gem.
# `timeout` is forwarded straight through to Faraday on every upload call (see
# Cloudinary::Uploader.call_api) — without it Cloudinary defaults to a 60s timeout, so a slow
# connection hangs the whole request for a minute before the controller-level retry (see
# ItemsController#save_item_with_retry) even gets a chance to try again. Kept short so a single
# failed attempt fails fast instead of hanging.
cloudinary:
  service: Cloudinary
  timeout: 10

# Use bin/rails credentials:edit to set the AWS secrets (as aws:access_key_id|secret_access_key)
# amazon:
#   service: S3
#   access_key_id: <%= Rails.application.credentials.dig(:aws, :access_key_id) %>
#   secret_access_key: <%= Rails.application.credentials.dig(:aws, :secret_access_key) %>
#   region: us-east-1
#   bucket: your_own_bucket-<%= Rails.env %>

# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
#   bucket: your_own_bucket-<%= Rails.env %>

# mirror:
#   service: Mirror
#   primary: local
#   mirrors: [ amazon, google, microsoft ]
