recyclable:
  name: "Recyclables"
  blurb: "This goes out with your recyclables — nothing to list, nothing to arrange."
  steps:
    - "Clean off recyclables and separate them into the four categories — plastic, PET bottles, glass bottles, and cans — before putting them out."
    - "Rinse out any residue and remove caps or labels where required."
    - "Put them out at the collection site before 8:00am on the designated day, once a week."
  cost_yen: 0
  chip_label: "Free"
  collection_frequency: "Once weekly"
  application_required: false
  position: 1
  subitems:
    - key: plastic_containers_packaging
      name: "Plastic containers & packaging"
      description: "Plastic containers/packages, and plastic products made entirely of plastic, under ~30cm on all sides."
      steps:
        - "Empty out any contents."
        - "Rinse and drain off residue."
        - "Place plastic containers, packaging, and plastic products together in a transparent bag."
        - "Paper price tags/labels that won't come off can stay on — don't double- or triple-bag."
      exceptions:
        - "Unremovable stains → combustible waste"
        - "Contains non-plastic material (e.g. metal) → non-combustible waste"
        - "Larger than 30cm on any side → large-sized waste"
        - "5mm+ thick items or videotapes → combustible waste"
        - "Rubber or silicone products → combustible waste"
        - "Knives, lighters → non-combustible waste"
        - "Items with a built-in rechargeable battery → contact manufacturer/distributor, don't bin"
    - key: pet_bottles
      name: "PET bottles"
      description: "For soft drinks, alcoholic beverages, soy sauce, etc."
      steps:
        - "Remove the cap and label (dispose as Plastic)."
        - "Rinse and drain off the water."
        - "Crush lengthwise — not vertically or by twisting."
        - "Put into a designated net or a transparent bag."
      exceptions:
        - "Contents were an oil product → combustible waste"
        - "Unremovable stains → combustible waste"
        - "Colored bottles (imported items, etc.) → dispose as Plastic instead, not combustible"
    - key: bottles
      name: "Bottles"
      description: "Glass bottles for beverages and food."
      steps:
        - "Remove caps (dispose separately as non-combustible)."
        - "Rinse and drain off the water."
        - "Put into the designated yellow bin or a transparent bag."
        - "Colored bottles are also collected."
      exceptions:
        - "Unremovable stains/oil → non-combustible waste"
        - "Broken bottles, glass sheets or glass cups → non-combustible waste"
        - "Cosmetic or chemical bottles → non-combustible waste"
        - "Medicine bottles ARE collected as bottles"
    - key: cans
      name: "Cans"
      description: "Aluminum and steel cans, for beverages and food."
      steps:
        - "Rinse and drain off the water."
        - "Put into the designated blue bin or a transparent bag."
        - "Close the lid lightly and dispose together."
        - "Pull-tops can be disposed of as-is."
      exceptions:
        - "Unremovable stains/oil → non-combustible waste"
        - "Spray cans → non-combustible waste (empty contents first, mark 危険)"

combustible:
  name: "Combustible waste"
  blurb: "This goes out with your combustible waste — nothing to list, nothing to arrange."
  steps:
    - "Bag it with your combustible waste."
    - "Put it out on one of the two weekly collection days."
  cost_yen: 0
  chip_label: "Free"
  collection_frequency: "Twice weekly"
  application_required: false
  position: 2
  subitems:
    - key: cooking_oil
      name: "Cooking oil / waste cooking oil"
      steps:
        - "Soak into paper or cloth, or solidify with a coagulant, before bagging."
        - "Alternative: bring vegetable oil only to the Meguro Eco Plaza drop-off."
    - key: twigs_and_dead_leaves
      name: "Twigs and dead leaves"
      steps:
        - "Cut twigs to 50cm or less."
        - "Bundle to 30cm or less in diameter."
        - "Up to two bundles collected at one time."
    - key: general_combustible
      name: "Kitchen garbage, clothes/fabric, leather/rubber, unrecyclable paper"
      steps:
        - "Drain kitchen garbage completely before bagging."
        - "Bag the rest with combustible waste as normal."

non_combustible:
  name: "Non-combustible waste"
  blurb: "Non-combustible waste — it goes out on the regular schedule with nothing to arrange."
  steps:
    - "Bag it with non-combustible waste."
    - "Check your ward calendar for the twice-monthly collection date."
  cost_yen: 0
  chip_label: "Free"
  collection_frequency: "Twice monthly"
  application_required: false
  position: 3
  subitems:
    - key: ceramics_glass
      name: "Ceramics, broken glass"
      steps:
        - "Wrap sharp or broken pieces with paper and mark 危険 (dangerous) before disposing."
    - key: spray_cans_lighters_gas_cartridges
      name: "Spray cans, lighters, gas cartridges"
      steps:
        - "Use up the contents completely first."
        - "Bag separately from other non-combustible waste."
        - "Mark the bag 危険 (dangerous)."
        - "You do not need to puncture the can."
    - key: small_appliance_non_designated
      name: "Small appliance, not one of the 9 designated types"
      description: "Under 30cm on its longest side."
      steps:
        - "Bag with non-combustible waste."
      exceptions:
        - "Rice cookers ≥1L capacity → large-sized waste instead, regardless of size class"

mercury_products:
  name: "Products containing mercury"
  blurb: "Contains mercury, so it's collected on its own once-a-month schedule, in its own bag — not with regular non-combustible waste."
  steps:
    - "Bag separately from other non-combustible waste."
    - "Fluorescent tubes/bulbs: place in original packaging or write 蛍光管 on the bag."
    - "Thermometers/blood-pressure monitors: write 水銀 on the bag."
  cost_yen: 0
  chip_label: "Free"
  collection_frequency: "Once monthly"
  application_required: false
  position: 4
  subitems:
    - key: fluorescent_lights
      name: "Tube- or bulb-shaped fluorescent lights"
    - key: mercury_thermometers_and_monitors
      name: "Mercury thermometers, mercury blood-pressure monitors"

used_paper:
  name: "Used paper"
  blurb: "Collected as used paper by your town council or residents' association — a different weekly pickup from regular recyclables."
  steps:
    - "Separate into three categories: newspapers, miscellaneous (magazines/books), cardboard."
    - "Bundle each category with rope — do not use tape."
    - "Cardboard: fold flat."
    - "Place outside the garbage container on the designated day."
  cost_yen: 0
  chip_label: "Free"
  collection_frequency: "Once weekly (group collection)"
  application_required: false
  position: 5
  subitems: []

designated_small_appliance:
  name: "Designated small appliance"
  blurb: "One of Meguro's nine designated small-appliance types — hand it in whole, no paperwork."
  steps:
    - "No need to remove the battery — collected whole."
    - "Drop into any small home-appliance collection box in Meguro."
    - "Nothing to book: no application needed."
  cost_yen: 0
  chip_label: "Free"
  collection_frequency: "Anytime — 10 drop-off points"
  application_required: false
  position: 6
  subitems:
    - { key: mobile_phones, name: "Mobile phones" }
    - { key: handheld_game_consoles, name: "Handheld game consoles" }
    - { key: portable_music_players, name: "Portable music players" }
    - { key: digital_cameras, name: "Digital cameras" }
    - { key: portable_video_cameras, name: "Portable video cameras" }
    - { key: electronic_dictionaries, name: "Electronic dictionaries" }
    - { key: desktop_calculators, name: "Desktop calculators" }
    - { key: car_navigation_devices, name: "Portable car navigation devices" }
    - { key: cables_and_adapters, name: "Cables and AC adapters" }

battery:
  name: "Battery"
  blurb: "Batteries go through a separate drop-off track, not regular collection."
  steps:
    - "Never put batteries in with regular non-combustible waste."
    - "Non-rechargeable batteries go in a collection box (insulate the terminals with tape first); rechargeable/Li-ion batteries go to a retailer with the recycle mark or the same collection boxes."
  cost_yen: 0
  chip_label: "Free"
  collection_frequency: "Anytime — drop-off or retailer"
  application_required: false
  position: 7
  subitems:
    - key: non_rechargeable
      name: "Alkaline / manganese / lithium primary / button batteries"
      steps:
        - "Insulate both terminals with tape."
        - "Deposit in a battery collection box at a city facility."
    - key: rechargeable
      name: "Rechargeable / Li-ion batteries, e-cigarettes, heated cigarettes, electric shavers/toothbrushes, portable fans"
      steps:
        - "Take to a retailer with the Ni-Cd/Ni-MH/Li-ion recycle mark, or use the same 10 small-appliance collection-box locations citywide."
        - "Heated cigarettes specifically: free collection via cigarette stores/retailers (Tobacco Institute of Japan)."

appliance_recycling_law:
  name: "Appliance Recycling Law item"
  blurb: "Covered by Japan's Home Appliance Recycling Law, so it goes through the recycling route rather than ward collection."
  steps:
    - "Apply online with the Home Appliance Recycling Ticket Center (24 hours), or hand the item back to the retailer you bought it from — or the one selling you the replacement."
    - "Your exact recycling fee depends on the manufacturer and size class; the RKC fee list publishes the per-brand amount."
    - "Pay the recycling fee plus a collection/transport charge when it's picked up. The transport charge is waived if you take it to a designated dealer yourself."
    - "There is no ward collection for this category — it cannot be put out as large-sized waste."
  # Fees revised early 2026 and differ depending on manufacturer,
  # so even air conditioners are now a range rather than one number.
  # Category-level low/high is the full span across the four subitems below,
  # used only when we can't tell which of the four an item is.
  cost_yen_low: 550
  cost_yen_high: 6149
  collection_fee_note: "A collection and transport fee of roughly ¥1,000–3,000 is charged separately on top, and varies by retailer or collection agent. It's waived if you deliver the item to a designated dealer yourself."
  application_url: "https://kaden23rc.jp/"
  application_label: "Home Appliance Recycling Ticket Center"
  chip_label: "Paid"
  collection_frequency: "On request via Pick-up Center"
  application_required: true
  position: 8
  subitems:
    - key: air_conditioners
      name: "Air conditioners"
      cost_yen_low: 550
      cost_yen_high: 1034
      keywords: ["air conditioner", "aircon", "air-con", "split unit"]
    - key: televisions
      name: "Televisions"
      cost_yen_low: 1870
      cost_yen_high: 3700
      keywords: ["tv", "television", "flat screen", "flatscreen"]
    - key: refrigerators_freezers
      name: "Refrigerators and freezers"
      cost_yen_low: 3740
      cost_yen_high: 6149
      keywords: ["refrigerator", "fridge", "freezer"]
    - key: washing_machines_dryers
      name: "Washing machines and dryers"
      cost_yen_low: 2530
      cost_yen_high: 3300
      keywords: ["washing machine", "washer", "clothes dryer", "tumble dryer", "laundry machine", "dryer"]


large_sized_waste:
  name: "Large-sized waste"
  blurb: "Large-sized waste — apply first, then put it out on the collection date you're given."
  steps:
    - "Apply first — online any time, or by phone on 03-5715-0053 (Mon–Sat, 8:00–19:00, closed Sundays and Dec 29–Jan 3)."
    - "You'll be given a collection date, a reference number, and the fee for your item."
    - "Buy a paid disposal sticker (有料粗大ごみ処理券) for that amount at a designated shop, and write the collection date and reference number on it."
    - "Stick it on the item and put it out at the instructed spot by 8:00am on the collection date."
  # Meguro's 5-tier fee schedule, current since the Oct 2023 revision. Each tier's
  # `name` lists the city's own published example items; `keywords` extends those
  # with reasonable equivalents so identification output actually matches.
  # Anything unmatched falls back to the category range below, flagged as approximate.
  cost_yen_low: 400
  cost_yen_high: 3000
  application_url: "https://www2.sodai-web.jp/meguro/index.html"
  application_label: "Meguro bulky waste online application"
  chip_label: "Paid"
  collection_frequency: "On request — apply first"
  application_required: true
  position: 9
  subitems:
    - key: tier_400
      name: "Storage boxes, suitcases, table chairs, vacuum cleaners, futons"
      cost_yen_low: 400
      cost_yen_high: 400
      keywords: ["suitcase", "storage box", "clothes box", "chair", "vacuum", "futon", "duvet", "bedding", "fan", "lamp", "light fixture", "air purifier", "hanger rack", "kids bike", "kids bicycle", "children's bicycle"]
    - key: tier_800
      name: "Microwaves, single-person sofas, tabletop sewing machines, water heaters"
      cost_yen_low: 800
      cost_yen_high: 800
      # Bicycles split by wheel size: 16" or under is ¥400, over 16" is ¥800.
      # Adult bikes are the common case, so a bare "bicycle" resolves here.
      keywords: ["microwave", "single sofa", "1-seater", "one-seater", "armchair", "sewing machine", "water heater", "bicycle", "bike"]
    - key: tier_1300
      name: "Bed mattresses, desks, dressing tables, dishwashers, fitness machines"
      cost_yen_low: 1300
      cost_yen_high: 1300
      keywords: ["mattress", "desk", "bed frame", "dressing table", "vanity", "dishwasher", "exercise bike", "treadmill", "walking machine", "karaoke", "electric bicycle", "electric bike", "e-bike", "electric-assist"]
    - key: tier_2100
      name: "Sofas for two or more, organs, foot-pedal sewing machines"
      cost_yen_low: 2100
      cost_yen_high: 2100
      keywords: ["sofa", "couch", "loveseat", "2-seater", "two-seater", "3-seater", "three-seater", "sectional", "organ"]
    - key: tier_3000
      name: "Double-pedestal desks"
      cost_yen_low: 3000
      cost_yen_high: 3000
      keywords: ["double-pedestal desk", "double pedestal desk", "double pedestal"]
    - key: storage_furniture_by_size
      name: "Storage furniture (priced by size)"
      # Meguro's real 5-tier fee schedule Each tier's `name` lists the city's own
      # published example items; `keywords` extends those with reasonable
      # equivalents so identification output actually matches. Anything
      # unmatched falls back to the category range below, flagged as approximate.
      cost_yen_low: 400
      cost_yen_high: 3000
      cost_label_override: "Depends on size"
      cost_note: "Storage furniture is priced by size — Meguro charges on the sum of its two longest sides, so the exact fee is confirmed when you apply."
      keywords: ["wardrobe", "closet", "bookcase", "bookshelf", "chest of drawers", "dresser", "cupboard", "shelving unit", "tansu", "cabinet", "sideboard"]

potted_plant:
  name: "Potted plant"
  blurb: "A potted plant has to be taken apart first — the leaves and roots, the soil, and the pot are each collected differently."
  steps:
    - "Leaves and roots: bag with your combustible waste."
    - "Soil: not collected as ordinary waste — take it to a garden center or gardening shop that accepts soil, or reuse it in another pot or your garden."
    - "Pot: ceramic or ordinary plastic pots go out as non-combustible waste; recyclable plastic pots go with your plastics collection."
  cost_yen: 0
  chip_label: "Free"
  application_required: false
  position: 10
  subitems: []
